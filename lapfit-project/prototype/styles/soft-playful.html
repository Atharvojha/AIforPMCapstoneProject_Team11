<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LapFit · Soft Playful</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2350;--muted:#5d5780;--primary:#5b4bdb;--primary-d:#4a3bc4;
  --lilac:#efe9ff;--peach:#ffe9e0;--mint:#def7ec;--sky:#e1f0ff;--line:rgba(91,75,219,.16);
  --glass:rgba(255,255,255,.72);--warn:#8a4b00;--warnbg:#fff1d6;
  --ease:cubic-bezier(.23,1,.32,1);--spring:cubic-bezier(.34,1.4,.64,1);
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);line-height:1.45;min-height:100vh;
  background:radial-gradient(900px 500px at 8% -5%,#ffe3ec 0,transparent 60%),radial-gradient(800px 500px at 95% 5%,#dcd4ff 0,transparent 60%),radial-gradient(700px 500px at 50% 100%,#d4f3e6 0,transparent 60%),#faf8ff;
  background-attachment:fixed;-webkit-tap-highlight-color:transparent;
  padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,.logo{font-family:Fredoka,Nunito,sans-serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:12px}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
@supports(padding:max(0px)){.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.logo{display:flex;align-items:center;gap:8px;font-size:1.5rem;font-weight:600;color:var(--primary)}
.logo svg{width:34px;height:28px}
nav{display:flex;gap:2px;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:999px;padding:3px}
nav button{min-height:44px;min-width:44px;padding:0 12px;border-radius:999px;font-weight:700;font-size:.95rem;color:var(--muted);transition:background-color .2s var(--ease),color .2s var(--ease),transform .15s var(--ease)}
nav button[aria-current=page]{background:var(--primary);color:#fff}
nav button:active{transform:scale(.97)}
@media(hover:hover){nav button:not([aria-current]):hover{background:var(--lilac);color:var(--ink)}}

/* hero */
.hero{display:grid;gap:20px;margin:24px 0}
.panel{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(91,75,219,.10)}
.hero-top{display:flex;align-items:center;gap:14px}
.lappy{width:92px;height:auto;flex-shrink:0;overflow:visible}
.lappy .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.lappy .body{transform-box:fill-box;transform-origin:50% 100%;transition:transform .25s var(--spring)}
.lappy.happy .body{transform:translateY(-4px) rotate(-3deg)}
.lappy .mouth-s{display:none}.lappy.happy .mouth-s{display:block}.lappy.happy .mouth-n{display:none}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
h1{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:600;line-height:1.15}
.sub{color:var(--muted);font-weight:600;font-size:.95rem}
.vibes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.vibe{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 14px;border-radius:16px;background:#fff;border:2px solid transparent;font-weight:800;font-size:1rem;text-align:left;box-shadow:0 2px 8px rgba(91,75,219,.08);transition:transform .2s var(--ease),border-color .2s var(--ease),background-color .2s var(--ease)}
.vibe .e{font-size:1.5rem}
.vibe:nth-child(1){--t:var(--lilac)}.vibe:nth-child(2){--t:var(--sky)}.vibe:nth-child(3){--t:var(--peach)}.vibe:nth-child(4){--t:var(--mint)}.vibe:nth-child(5){--t:#fff3c9}
.vibe[aria-pressed=true]{background:var(--t);border-color:var(--primary)}
.vibe:active{transform:scale(.97)}
@media(hover:hover){.vibe:hover{transform:translateY(-2px);background:var(--t)}.vibe:active{transform:scale(.97)}}
.budget{margin-top:18px}
.brow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.brow label{font-weight:800}
.bval{font-family:Fredoka,sans-serif;font-size:1.3rem;font-weight:600;color:var(--primary);font-variant-numeric:tabular-nums}
.fit{font-weight:700;color:var(--muted);font-size:.95rem}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin-top:4px;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:99px;background:linear-gradient(90deg,var(--primary) var(--p,30%),#e4def8 var(--p,30%))}
input[type=range]::-moz-range-track{height:12px;border-radius:99px;background:#e4def8}
input[type=range]::-moz-range-progress{height:12px;border-radius:99px;background:var(--primary)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-9px;border-radius:50%;background:#fff;border:4px solid var(--primary);box-shadow:0 3px 10px rgba(91,75,219,.35)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--primary)}
.ends{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700;color:var(--muted)}

/* cards */
.rh{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 12px}
.rh h2{font-size:1.4rem;font-weight:600}
.grid{display:grid;gap:16px}
.card{position:relative;display:flex;flex-direction:column;gap:12px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.95);border-radius:24px;padding:16px;box-shadow:0 10px 30px rgba(91,75,219,.10);transition:transform .25s var(--ease),box-shadow .25s var(--ease);animation:rise .45s var(--ease) backwards;animation-delay:calc(var(--i)*40ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.95)}}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(91,75,219,.18)}}
.pic{position:relative;aspect-ratio:4/3;border-radius:18px;background:linear-gradient(135deg,var(--lilac),var(--peach));display:grid;place-items:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain;padding:10px;background:#fff;mix-blend-mode:normal}
.pic .fb{position:absolute;inset:0;display:none;place-items:center;align-content:center;gap:4px;background:linear-gradient(135deg,var(--lilac),var(--peach));font-weight:700;color:var(--muted);font-size:.85rem}
.pic.err img{display:none}.pic.err .fb{display:grid}
.rank{position:absolute;top:10px;left:10px;background:var(--primary);color:#fff;font-weight:800;font-size:.85rem;padding:5px 12px;border-radius:99px;z-index:1}
.chip{position:absolute;top:4px;right:4px;z-index:1;min-height:44px;padding:0 14px;border-radius:99px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:.9rem;color:var(--primary-d);transition:transform .15s var(--ease),background-color .2s var(--ease)}
.chip[aria-pressed=true]{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip:active{transform:scale(.97)}
.card h3{font-size:1.25rem;font-weight:600;line-height:1.2}
.ver{color:var(--muted);font-weight:700;font-size:.95rem}
.price{font-family:Fredoka,sans-serif;font-size:1.7rem;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);font-weight:700}
.nv{background:var(--warnbg);color:var(--warn);border-radius:99px;padding:4px 10px;font-weight:800}
.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.spec{border-radius:16px;padding:10px 12px;background:var(--t)}
.spec:nth-child(1){--t:var(--lilac)}.spec:nth-child(2){--t:var(--sky)}.spec:nth-child(3){--t:var(--mint)}.spec:nth-child(4){--t:var(--peach)}
.spec small{display:block;font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.spec b{font-family:Fredoka,sans-serif;font-size:1.1rem;font-weight:500}
.unk{border:1.5px dashed var(--muted);border-radius:8px;padding:0 6px}
.ringrow{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.7);border-radius:16px;padding:10px 12px}
.ring{width:64px;height:64px;flex-shrink:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .bg{stroke:#e4def8}.ring .fg{stroke:var(--primary);stroke-dasharray:var(--d) 100;transition:stroke-dasharray .8s var(--ease)}
.ringrow p{font-weight:700;font-size:.95rem}.ringrow strong{font-weight:800}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.act{min-height:56px;padding:6px 4px;border-radius:16px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:.85rem;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .15s var(--ease),background-color .2s var(--ease)}
.act.main{background:var(--primary);color:#fff;border-color:var(--primary)}
.act:active{transform:scale(.97)}
@media(hover:hover){.act:not(.main):hover{background:var(--lilac)}.act.main:hover{background:var(--primary-d)}}
.foot{margin:24px 0 32px;text-align:center;color:var(--muted);font-weight:700;font-size:.9rem}

@media(min-width:760px){
  .hero{grid-template-columns:1.1fr 1fr;align-items:stretch}
  .vibes{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:repeat(2,1fr)}
  .card.feat{grid-column:1/-1;display:grid;grid-template-columns:1fr 1.1fr;gap:16px 20px}
  .card.feat>*{grid-column:2}.card.feat .pic{grid-column:1;grid-row:1/span 8;aspect-ratio:auto;min-height:280px}
}
@media(min-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:380px){nav button{padding:0 8px;font-size:.85rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <div class="logo"><svg viewBox="0 0 34 28" aria-hidden="true"><rect x="5" y="2" width="24" height="17" rx="5" fill="#5b4bdb"/><circle cx="13" cy="10" r="2" fill="#fff"/><circle cx="21" cy="10" r="2" fill="#fff"/><rect x="1" y="21" width="32" height="5" rx="2.5" fill="#9f93f0"/></svg>LapFit</div>
  <nav aria-label="Main"><button aria-current="page">Ask</button><button>Explore</button><button>Check</button><button>Sell</button><button>You</button></nav>
</div></header>

<main class="wrap">
<section class="hero" aria-labelledby="q">
  <div class="panel">
    <div class="hero-top">
      <svg class="lappy" id="lappy" viewBox="0 0 100 80" role="img" aria-label="Lappy, the LapFit mascot laptop">
        <g class="body">
          <rect x="12" y="4" width="76" height="52" rx="12" fill="#5b4bdb"/>
          <rect x="18" y="10" width="64" height="40" rx="8" fill="#f4f0ff"/>
          <ellipse class="eye" cx="38" cy="28" rx="4" ry="5.5" fill="#2b2350"/>
          <ellipse class="eye" cx="62" cy="28" rx="4" ry="5.5" fill="#2b2350"/>
          <circle cx="29" cy="37" r="4" fill="#ffb8c8" opacity=".8"/><circle cx="71" cy="37" r="4" fill="#ffb8c8" opacity=".8"/>
          <path class="mouth-n" d="M44 38q6 5 12 0" fill="none" stroke="#2b2350" stroke-width="2.5" stroke-linecap="round"/>
          <path class="mouth-s" d="M42 36q8 10 16 0z" fill="#2b2350"/>
          <path d="M4 60h92l-6 12a6 6 0 0 1-5 3H15a6 6 0 0 1-5-3z" fill="#9f93f0"/>
          <rect x="40" y="62" width="20" height="4" rx="2" fill="#d9d2fa"/>
        </g>
      </svg>
      <div><h1 id="q">What will you use it for?</h1><p class="sub">Pick a vibe and a budget. I'll be honest about what I find.</p></div>
    </div>
    <div class="vibes" role="group" aria-label="Usage">
      <button class="vibe" aria-pressed="false"><span class="e" aria-hidden="true">💻</span>Coding</button>
      <button class="vibe" aria-pressed="false"><span class="e" aria-hidden="true">📚</span>Study</button>
      <button class="vibe" aria-pressed="false"><span class="e" aria-hidden="true">🎮</span>Gaming</button>
      <button class="vibe" aria-pressed="false"><span class="e" aria-hidden="true">🎬</span>Editing</button>
      <button class="vibe" aria-pressed="false"><span class="e" aria-hidden="true">🏠</span>Everyday</button>
    </div>
  </div>
  <div class="panel budget">
    <div class="brow"><label for="bud">Budget</label><span class="bval" id="bval" aria-live="polite">up to ₹60,000</span></div>
    <input id="bud" type="range" min="20000" max="150000" step="1000" value="60000">
    <div class="ends"><span>₹20,000</span><span>₹1,50,000</span></div>
    <p class="fit" id="fit" aria-live="polite" style="margin-top:10px">9 laptops fit</p>
  </div>
</section>

<div class="rh"><h2>Your top picks</h2><span class="sub" id="cmp">Compare: none picked</span></div>
<section class="grid" id="grid" aria-label="Results"></section>
<p class="foot">Pictures are from the web and may not show this exact version.</p>
</main>

<script>
const L=[
 {n:"ASUS VivoBook 15 (2022) Core i3 10th Gen",p:28170,v:"8 GB / 512 GB",ram:"8 GB",st:"512 GB",sc:'15.6"',w:"1.8 kg",img:"https://5.imimg.com/data5/SELLER/Default/2022/10/YK/ED/WB/162122710/asus-vivobook-15-2021-core-i3-10th-gen-4-gb-512-gb-ssd-silver-color.jpg"},
 {n:"Lenovo IdeaPad 3 Ryzen 5 5500U",p:38952,v:"8 GB / 512 GB",ram:"8 GB",st:"512 GB",sc:'15.6"',w:"1.65 kg",img:"https://m.media-amazon.com/images/I/61q6x-ll5FL.jpg"},
 {n:"HP Ryzen 5 5500U",p:38944,v:"8 GB / 512 GB",ram:"8 GB",st:"512 GB",sc:'15.6"',w:"1.69 kg",img:"https://rukminim3.flixcart.com/image/480/480/xif0q/computer/9/k/j/-enriched-transparent-original-imahg5fxdsurqysm.png?q=90"}
];
const fmt=n=>n.toLocaleString('en-IN');
const picked=new Set();
const grid=document.getElementById('grid');
const pct=101/196*100;
grid.innerHTML=L.map((x,i)=>`
<article class="card${i?'':' feat'}" style="--i:${i}" aria-label="${x.n}">
  <div class="pic"><span class="rank">#${i+1}</span>
    <button class="chip" aria-pressed="false" data-i="${i}">＋ Compare</button>
    <img src="${x.img}" alt="${x.n}" loading="lazy" referrerpolicy="no-referrer">
    <div class="fb"><svg width="64" height="48" viewBox="0 0 64 48" aria-hidden="true"><rect x="8" y="3" width="48" height="31" rx="7" fill="#9f93f0"/><rect x="12" y="7" width="40" height="23" rx="4" fill="#f4f0ff"/><path d="M2 37h60l-4 7H6z" fill="#5b4bdb"/></svg>Picture unavailable</div></div>
  <h3>${x.n}</h3>
  <div class="ver">${x.v}</div>
  <div class="price">₹${fmt(x.p)}</div>
  <div class="meta"><span>as of 10 Nov 2026 · 3 days old</span><span class="nv">Not human-verified</span></div>
  <div class="specs">
    <div class="spec"><small>RAM</small><b>${x.ram}</b></div>
    <div class="spec"><small>Storage</small><b>${x.st}</b></div>
    <div class="spec"><small>Screen</small><b>${x.sc}</b></div>
    <div class="spec"><small>Weight</small><b>${x.w}</b></div>
  </div>
  <div class="ringrow">
    <svg class="ring" viewBox="0 0 36 36" role="img" aria-label="101 of 196 owner opinions positive"><circle class="bg" cx="18" cy="18" r="15.9" pathLength="100"/><circle class="fg" cx="18" cy="18" r="15.9" pathLength="100" style="--d:${pct.toFixed(1)}"/></svg>
    <p><strong>196 owner opinions,</strong> 101 positive</p>
  </div>
  <div class="acts">
    <button class="act main"><span aria-hidden="true">💬</span>Owners say</button>
    <button class="act"><span aria-hidden="true">🔎</span>Full check</button>
    <button class="act"><span aria-hidden="true">🛒</span>Where to buy</button>
  </div>
</article>`).join('');
grid.querySelectorAll('.pic img').forEach(im=>{
  const f=()=>im.parentElement.classList.add('err');
  im.addEventListener('error',f);if(im.complete&&!im.naturalWidth)f();
});
const lappy=document.getElementById('lappy');
let t;const cheer=()=>{lappy.classList.add('happy');clearTimeout(t);t=setTimeout(()=>lappy.classList.remove('happy'),1400)};
grid.addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  const i=+c.dataset.i,on=c.getAttribute('aria-pressed')!=='true';
  c.setAttribute('aria-pressed',on);c.textContent=on?'✓ Comparing':'＋ Compare';
  on?picked.add(i):picked.delete(i);
  document.getElementById('cmp').textContent=picked.size?`Compare: ${picked.size} picked`:'Compare: none picked';
});
if(matchMedia('(hover:hover)').matches){
  grid.addEventListener('mouseover',e=>{if(e.target.closest('.card'))cheer()});
}
document.querySelectorAll('.vibe').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.vibe').forEach(o=>o.setAttribute('aria-pressed',o===b&&b.getAttribute('aria-pressed')!=='true'));
  cheer();
}));
const bud=document.getElementById('bud');
const upd=()=>{
  const v=+bud.value;
  bud.style.setProperty('--p',((v-20000)/130000*100)+'%');
  document.getElementById('bval').textContent='up to ₹'+fmt(v);
  document.getElementById('fit').textContent=v===60000?'9 laptops fit':'? laptops fit (count known only at ₹60,000)';
};
bud.addEventListener('input',upd);upd();
</script>
</body>
</html>
