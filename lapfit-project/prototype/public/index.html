<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LapFit</title>
<meta name="description" content="Know a laptop before you buy it, and while you own it. Sample data prototype.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23256f68'/%3E%3Cpath d='M8 10h16v10H8zM5 22h22' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#/home" aria-label="LapFit home">LapFit</a>
    <nav class="toplinks" aria-label="More">
      <a href="#/market">Market</a>
      <a href="#/insights">For brands</a>
      <a href="#/vision">How it works</a>
    </nav>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav class="tabs" id="tabs" aria-label="Main"></nav>

<div id="compareBar" class="comparebar" hidden>
  <span id="compareCount"></span>
  <button class="btn primary small-btn" id="openCompare" type="button">Compare</button>
  <button class="btn ghost small-btn" id="clearCompare" type="button">Clear</button>
</div>
<div id="drawer" class="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="sheet">
    <div class="sheet-head"><h2 id="drawerTitle">Compare</h2><button class="btn ghost small-btn" id="closeDrawer" type="button">Close</button></div>
    <div class="sheet-body" id="drawerBody"></div>
  </div>
</div>
<script src="/app.js" type="module"></script>
</body>
</html>
